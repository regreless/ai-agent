name: ai-agent

services:
  postgres:
    build: ./docker/postgres
    image: local/postgres_vector:18.6-0.8.6
    container_name: postgres18
    restart: unless-stopped
    env_file:
      - path: .env.postgres
        format: raw
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:16333:6333"
      - "127.0.0.1:16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    external: true
    name: postgres18_data
  qdrant_data:
    external: true
    name: ai-agent_qdrant_data
  redis_data:
